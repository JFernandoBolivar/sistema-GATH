services:
  django:
    container_name: django-App
    build:
      context: ./BACKEND
      dockerfile: django.dockerfile
    env_file:
      - ./BACKEND/.env
    environment:
      - DJANGO_DB_HOST=host.docker.internal
      - FRONTEND_URL=http://localhost:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      backend:
        aliases:
          - djangoapp
      broker:
      storage:
    ports:
      - "8001:8000"
    volumes:
      - staticfiles:/app/Django/staticfiles
      - "/opt/gath/BACKEND/media:/app/Django/media"
      - "/opt/gath/BACKEND/staticfiles:/app/Django/staticfiles"
    restart: always

  nextjs:
    container_name: nextjs-App
    build:
      context: ./NextJS
      dockerfile: nextjs.dockerfile
    env_file:
      - ./NextJS/.env
    environment:
      - DJANGO_API_SERVER=http://djangoapp:8000
      - NEXTAUTH_URL=http://localhost:3001
    ports:
      - "3001:3000"
    networks:
      backend:
    depends_on:
      - django
    restart: always

  # ── SeaweedFS ──────────────────────────────────────────────────────────────
  sw_master:
    image: chrislusf/seaweedfs:3.80
    container_name: sw_master
    restart: always
    command: >
      master -ip=sw_master -port=9333
      -volumeSizeLimitMB=1024
      -defaultReplication=000
    volumes:
      - sw_master_data:/data
    networks: [storage]
    deploy:
      resources:
        limits: { memory: 512M }

  sw_volume:
    image: chrislusf/seaweedfs:3.80
    container_name: sw_volume
    restart: always
    command: >
      volume -mserver=sw_master:9333 -ip=sw_volume -port=8080
      -max=64 -dir=/data
    volumes:
      - sw_volume_data:/data
    networks: [storage]
    depends_on:
      - sw_master
    deploy:
      resources:
        limits: { memory: 1G }

  sw_filer:
    image: chrislusf/seaweedfs:3.80
    container_name: sw_filer
    restart: always
    command: >
      filer -master=sw_master:9333 -ip=sw_filer -port=8888
    volumes:
      - sw_filer_data:/data
    networks: [storage]
    depends_on:
      - sw_master
      - sw_volume
    deploy:
      resources:
        limits: { memory: 512M }

  sw_s3:
    image: chrislusf/seaweedfs:3.80
    container_name: sw_s3
    restart: always
    command: >
      s3 -filer=sw_filer:8888 -port=8333
      -ip.bind=0.0.0.0
      -allowEmptyFolder=false
    networks:
      storage:
        aliases:
          - sw-s3
    depends_on:
      - sw_filer
    deploy:
      resources:
        limits: { memory: 512M }

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gath_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER no definido (fallo cerrado, ver infra-fase2/.env.fase2.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS no definido (fallo cerrado, ver infra-fase2/.env.fase2.example)}
      RABBITMQ_DEFAULT_VHOST: gath
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [broker]
    deploy:
      resources:
        limits: { memory: 768M }

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"

volumes:
  portainer_data:
    name: portainer_data
    external: true
  staticfiles:
    name: staticfiles
  sw_master_data:
    name: gath_sw_master
  sw_volume_data:
    name: gath_sw_volume
  sw_filer_data:
    name: gath_sw_filer
  rabbitmq_data:
    name: gath_rabbitmq

networks:
  default:
    name: portainer_network
    external: true
  backend:
    driver: bridge
  storage:
    driver: bridge
    internal: true
  broker:
    driver: bridge
    internal: true
