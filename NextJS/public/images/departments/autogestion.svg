<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Persona revisando y actualizando su tarjeta de datos con un lápiz">
  <!-- Fondo crema, mismo tono que datos.jpg -->
  <rect width="800" height="800" rx="48" fill="#F7EFE1"/>

  <!-- Círculo de énfasis -->
  <circle cx="400" cy="392" r="250" fill="none" stroke="#3B4650" stroke-width="26" stroke-linecap="round" stroke-dasharray="1180 320" transform="rotate(-38 400 392)"/>

  <!-- Persona: cabeza y hombros -->
  <path d="M258 584c6-96 62-160 142-160s136 64 142 160" fill="#5E9FB8" stroke="#3B4650" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="302" r="94" fill="#F1C9A5" stroke="#3B4650" stroke-width="26"/>
  <path d="M318 288c14-52 52-80 94-80 44 0 78 28 88 74-42-16-74-22-112-16-24 4-48 12-70 22z" fill="#3B4650"/>

  <!-- Brazo que sostiene la tarjeta -->
  <path d="M284 520c34 14 62 42 74 80" fill="none" stroke="#3B4650" stroke-width="26" stroke-linecap="round"/>

  <!-- Tarjeta de datos -->
  <g transform="rotate(-8 470 540)">
    <rect x="300" y="430" width="330" height="220" rx="26" fill="#5E9FB8" stroke="#3B4650" stroke-width="26"/>
    <rect x="336" y="468" width="96" height="96" rx="16" fill="#F7EFE1" stroke="#3B4650" stroke-width="18"/>
    <circle cx="384" cy="500" r="18" fill="#5E9FB8"/>
    <path d="M358 548c6-18 18-28 26-28s20 10 26 28" fill="#5E9FB8"/>
    <rect x="460" y="476" width="132" height="20" rx="10" fill="#F7EFE1"/>
    <rect x="460" y="514" width="104" height="20" rx="10" fill="#F7EFE1" opacity="0.75"/>
    <rect x="336" y="592" width="200" height="20" rx="10" fill="#F7EFE1" opacity="0.75"/>
    <path d="M560 596l18 18 34-42" fill="none" stroke="#E08A3C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lápiz naranja -->
  <g transform="rotate(34 600 360)">
    <rect x="574" y="196" width="62" height="236" rx="16" fill="#E08A3C" stroke="#3B4650" stroke-width="22"/>
    <path d="M574 432l31 70 31-70z" fill="#F7EFE1" stroke="#3B4650" stroke-width="22" stroke-linejoin="round"/>
    <path d="M593 478l12 24 12-24z" fill="#3B4650"/>
    <rect x="574" y="196" width="62" height="42" rx="14" fill="#3B4650"/>
  </g>

  <!-- Mano sobre el lápiz -->
  <circle cx="594" cy="470" r="34" fill="#F1C9A5" stroke="#3B4650" stroke-width="22"/>

  <!-- Signos de revisión -->
  <path d="M196 250c26-24 50-40 78-50" fill="none" stroke="#3B4650" stroke-width="22" stroke-linecap="round"/>
  <circle cx="640" cy="236" r="20" fill="#E08A3C"/>
  <circle cx="690" cy="292" r="12" fill="#3B4650"/>
</svg>
